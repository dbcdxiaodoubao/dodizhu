syntax = "proto3";

package doudizhu;

enum MessageId {
  MSG_UNKNOWN = 0;
  C2S_LOGIN = 1;
  S2C_LOGIN_RET = 2;
  C2S_HEARTBEAT = 3;
  S2C_HEARTBEAT_RET = 4;
  C2S_QUICK_MATCH = 5;
  S2C_MATCH_RET = 6;
  C2S_CALL_LANDLORD = 7;
  S2C_CALL_LANDLORD_RET = 8;
  C2S_PLAY_CARDS = 9;
  S2C_PLAY_CARDS_RET = 10;
  C2S_PASS = 11;
  S2C_PASS_RET = 12;
  S2C_DEAL_CARDS = 13;
  C2S_RECONNECT = 14;
  S2C_RECONNECT_SYNC = 15;
  S2C_SETTLE_RESULT = 16;
  S2C_PLAY_BROADCAST = 17;
  S2C_TIMEOUT_ACTION = 18;
  S2C_ROOM_STATE = 19;
}

message C2SLogin {
  string player_id = 1;
}

message S2CLoginRet {
  bool success = 1;
  string player_id = 2;
  int32 coins = 3;
  string message = 4;
}

message C2SHeartBeat {
  int64 client_time = 1;
}

message S2CHeartBeatRet {
  int64 server_time = 1;
}

message C2SQuickMatch {}

message C2SCallLandlord {
  bool call = 1;
}

message S2CMatchRet {
  bool success = 1;
  uint64 room_id = 2;
  string message = 3;
  uint32 seat = 4;
  bool game_started = 5;
}

message S2CCallLandlordRet {
  bool accepted = 1;
  uint32 current_seat = 2;
  bool game_started = 3;
  uint32 landlord_seat = 4;
  uint32 actor_seat = 5;
  bool called = 6;
}

message C2SPlayCards {
  repeated uint32 cards = 1;
}

message S2CPlayCardsRet {
  bool accepted = 1;
  uint32 current_seat = 2;
  bool game_over = 3;
}

message C2SPass {}

message S2CPassRet {
  bool accepted = 1;
  uint32 current_seat = 2;
  bool game_over = 3;
}

message S2CDealCards {
  repeated uint32 cards = 1;
  uint32 seat = 2;
  uint32 current_seat = 3;
}

message C2SReconnect {}

message S2CReconnectSync {
  uint64 room_id = 1;
  uint32 seat = 2;
  uint32 phase = 3;
  uint32 current_seat = 4;
  uint32 landlord_seat = 5;
  repeated uint32 cards = 6;
}

message S2CSettleResult {
  bool win = 1;
  int32 coin_change = 2;
}

message S2CPlayBroadcast {
  uint32 seat = 1;
  repeated uint32 cards = 2;
  bool passed = 3;
  uint32 current_seat = 4;
}

message S2CTimeoutAction {
  uint32 actor_seat = 1;
  uint32 phase = 2;
  uint32 current_seat = 3;
}

message RoomPlayer {
  uint32 seat = 1;
  string player_id = 2;
  bool online = 3;
  uint32 remaining_cards = 4;
}

message S2CRoomState {
  uint64 room_id = 1;
  uint32 self_seat = 2;
  uint32 phase = 3;
  uint32 current_seat = 4;
  uint32 landlord_seat = 5;
  repeated RoomPlayer players = 6;
  repeated uint32 own_cards = 7;
  repeated uint32 bottom_cards = 8;
  uint32 last_play_seat = 9;
  repeated uint32 last_play_cards = 10;
  uint32 action_remaining_seconds = 11;
}
