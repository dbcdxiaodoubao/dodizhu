spring:
  application:
    name: doudizhu-backend
  web:
    resources:
      static-locations: file:../web/
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/doudizhu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:game}
    password: ${DB_PASSWORD:game_dev_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    name: ../logs/backend.log
  logback:
    rollingpolicy:
      file-name-pattern: ../logs/backend.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
