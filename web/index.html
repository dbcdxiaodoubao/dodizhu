<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>斗地主联机演示</title>
  <style>
    body { background: #10231b; color: #e7f5e8; font: 16px system-ui, sans-serif; margin: 0; }
    main { max-width: 820px; margin: 48px auto; padding: 24px; background: #173429; border-radius: 16px; }
    .seats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
    .seat { padding: 14px; background: #214b3a; border: 1px solid #39785b; border-radius: 10px; }
    .seat.active { border-color: #d9b55a; box-shadow: 0 0 0 2px #d9b55a55; }
    .seat.offline { opacity: .5; }
    input, button { font: inherit; padding: 10px; border-radius: 8px; border: 0; }
    input { width: 220px; }
    button { background: #d9b55a; color: #1c190c; cursor: pointer; margin: 4px; }
    #hand button.selected { background: #73c98d; transform: translateY(-8px); }
    #status { font-weight: 700; }
    pre { min-height: 180px; overflow: auto; background: #09150f; padding: 16px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>斗地主联机演示</h1>
    <p id="status">未连接</p>
    <p id="profile">金币：--</p>
    <p id="stats">战绩：--</p>
    <p id="history">最近对局：--</p>
    <p id="game-state">阶段：等待连接</p>
    <p id="countdown">倒计时：--</p>
    <input id="player-id" value="web-player" placeholder="玩家 ID">
    <div>
      <button id="connect">连接 WebSocket</button>
      <button id="login">登录</button>
      <button id="heartbeat">心跳</button>
      <button id="match">快速匹配</button>
      <button id="call">叫地主</button>
      <button id="decline">不叫地主</button>
      <button id="play">出牌</button>
      <button id="pass">过牌</button>
      <button id="reconnect">重连同步</button>
    </div>
    <p>手牌：</p><div id="hand">等待发牌</div>
    <p>底牌：<span id="bottom-cards">等待地主确定</span></p>
    <p>上一手：<span id="last-play">暂无</span></p>
    <div id="seats" class="seats">
      <div class="seat">座位 0：等待</div>
      <div class="seat">座位 1：等待</div>
      <div class="seat">座位 2：等待</div>
    </div>
    <pre id="log"></pre>
  </main>
  <script>
    const status = document.querySelector('#status');
    const profile = document.querySelector('#profile');
    const stats = document.querySelector('#stats');
    const history = document.querySelector('#history');
    const gameState = document.querySelector('#game-state');
    const countdown = document.querySelector('#countdown');
    const log = document.querySelector('#log');
    const playerId = document.querySelector('#player-id');
    const hand = document.querySelector('#hand');
    const bottomCards = document.querySelector('#bottom-cards');
    const lastPlay = document.querySelector('#last-play');
    const seats = document.querySelector('#seats');
    let socket;
    let heartbeatTimer;
    let reconnectTimer;
    let shouldReconnect = true;
    let loggedIn = false;
    let reconnectAfterLogin = false;
    let handCodes = [];
    let playerSeat = null;
    let currentSeat = null;
    let phase = 0;
    let actionDeadline = null;
    const selectedCards = new Set();

    function write(message) {
      log.textContent += `${message}\n`;
      log.scrollTop = log.scrollHeight;
    }

    function varint(value) {
      const bytes = [];
      do {
        let byte = value & 0x7f;
        value >>>= 7;
        if (value) byte |= 0x80;
        bytes.push(byte);
      } while (value);
      return bytes;
    }

    function frame(messageId, body = []) {
      const bytes = new Uint8Array(6 + body.length);
      const view = new DataView(bytes.buffer);
      view.setUint32(0, bytes.length, false);
      view.setUint16(4, messageId, false);
      bytes.set(body, 6);
      return bytes;
    }

    function send(messageId, body) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        write('请先连接 WebSocket');
        return;
      }
      socket.send(frame(messageId, body));
    }

    function sendLogin() {
      const text = new TextEncoder().encode(playerId.value.trim());
      send(1, [0x0a, ...varint(text.length), ...text]);
    }

    async function loadProfile() {
      const id = playerId.value.trim();
      if (!id) return;
      try {
        const response = await fetch(`http://127.0.0.1:8080/api/players/${encodeURIComponent(id)}`);
        if (!response.ok) return;
        const data = await response.json();
        profile.textContent = `金币：${data.coins}`;
        const statsResponse = await fetch(`/api/players/${encodeURIComponent(id)}/stats`);
        if (statsResponse.ok) {
          const value = await statsResponse.json();
          const rate = value.games ? Math.round(value.wins * 100 / value.games) : 0;
          stats.textContent = `战绩：${value.games} 局，胜率 ${rate}%，累计 ${value.coinChange >= 0 ? '+' : ''}${value.coinChange}`;
        }
        const historyResponse = await fetch(`/api/games/${encodeURIComponent(id)}/history`);
        if (historyResponse.ok) {
          const games = await historyResponse.json();
          history.textContent = games.length
            ? `最近对局：${games.map(game => `${game.result} ${game.coinChange >= 0 ? '+' : ''}${game.coinChange}`).join(' | ')}`
            : '最近对局：暂无';
        }
      } catch (_) {
        profile.textContent = '金币：后台未连接';
      }
    }

    function readVarint(bytes, index) {
      let value = 0;
      let shift = 0;
      while (index < bytes.length) {
        const byte = bytes[index++];
        value |= (byte & 0x7f) << shift;
        if (!(byte & 0x80)) return [value, index];
        shift += 7;
      }
      throw new Error('invalid varint');
    }

    function cardName(encoded) {
      const rank = Math.floor(encoded / 4);
      const suit = ['♣', '♦', '♥', '♠'][encoded % 4];
      const names = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2', 16: '小王', 17: '大王' };
      return rank >= 16 ? names[rank] : `${suit}${names[rank] || rank}`;
    }

    function cardsForField(bytes, wantedField) {
      const cards = [];
      let index = 6;
      while (index < bytes.length) {
        const [tag, afterTag] = readVarint(bytes, index);
        index = afterTag;
        const field = tag >> 3;
        const wireType = tag & 7;
        if (field === wantedField && wireType === 2) {
          const [length, afterLength] = readVarint(bytes, index);
          index = afterLength;
          const end = index + length;
          while (index < end) {
            const [value, afterValue] = readVarint(bytes, index);
            index = afterValue;
            cards.push(value);
          }
          continue;
        }
        if (wireType === 0) {
          const [value, afterValue] = readVarint(bytes, index);
          index = afterValue;
          if (field === wantedField) cards.push(value);
        } else if (wireType === 2) {
          const [length, afterLength] = readVarint(bytes, index);
          index = afterLength + length;
        } else {
          break;
        }
      }
      return cards;
    }

    function showDeal(bytes, cardField = 1) {
      const cards = [];
      let seat = null;
      let index = 6;
      while (index < bytes.length) {
        const [tag, afterTag] = readVarint(bytes, index);
        index = afterTag;
        const field = tag >> 3;
        const wireType = tag & 7;
        if (field === cardField && wireType === 2) {
          const [length, afterLength] = readVarint(bytes, index);
          index = afterLength;
          const end = index + length;
          while (index < end) {
            const [value, afterValue] = readVarint(bytes, index);
            index = afterValue;
            cards.push(value);
          }
          continue;
        }
        if (wireType !== 0) break;
        const [value, afterValue] = readVarint(bytes, index);
        index = afterValue;
        if (field === cardField) cards.push(value);
        if ((cardField === 1 && field === 2) || (cardField === 6 && field === 2) || (cardField === 7 && field === 2)) seat = value;
      }
      if (seat !== null) playerSeat = seat;
      const dealtCurrentSeat = cardField === 7 ? readField(bytes, 4) : readField(bytes, 3);
      if (dealtCurrentSeat !== null) currentSeat = dealtCurrentSeat;
      if (cardField === 1) phase = 1;
      if (cardField === 7) phase = readField(bytes, 3) || phase;
      handCodes = cards.sort((left, right) => right - left);
      selectedCards.clear();
      renderHand();
      if (cardField === 1) gameState.textContent = `阶段：叫地主，当前座位：${currentSeat}`;
    }

    function readField(bytes, wantedField) {
      let index = 6;
      while (index < bytes.length) {
        const [tag, afterTag] = readVarint(bytes, index);
        index = afterTag;
        if ((tag & 7) !== 0) return null;
        const [value, afterValue] = readVarint(bytes, index);
        index = afterValue;
        if ((tag >> 3) === wantedField) return value;
      }
      return null;
    }

    function applyPlayBroadcast(bytes) {
      let index = 6;
      let seat = null;
      let passed = false;
      const cards = [];
      while (index < bytes.length) {
        const [tag, afterTag] = readVarint(bytes, index);
        index = afterTag;
        const field = tag >> 3;
        const wireType = tag & 7;
        if (field === 2 && wireType === 2) {
          const [length, afterLength] = readVarint(bytes, index);
          index = afterLength;
          const end = index + length;
          while (index < end) {
            const [value, afterValue] = readVarint(bytes, index);
            index = afterValue;
            cards.push(value);
          }
          continue;
        }
        if (wireType !== 0) break;
        const [value, afterValue] = readVarint(bytes, index);
        index = afterValue;
        if (field === 1) seat = value;
        if (field === 2) cards.push(value);
        if (field === 3) passed = value !== 0;
      }
      if (seat === playerSeat && !passed) {
        handCodes = handCodes.filter(code => !cards.includes(code));
        selectedCards.clear();
        renderHand();
      }
      const nextSeat = readField(bytes, 4);
      if (nextSeat !== null) currentSeat = nextSeat;
      phase = 2;
      updateControls();
      gameState.textContent = passed
        ? `座位 ${seat} 过牌，当前座位：${currentSeat}`
        : `座位 ${seat} 出牌，当前座位：${currentSeat}`;
    }

    function applyCallLandlord(bytes) {
      const actor = readField(bytes, 5);
      const called = readField(bytes, 6) !== 0;
      const started = readField(bytes, 3) !== 0;
      const landlord = readField(bytes, 4);
      const nextSeat = readField(bytes, 2);
      if (nextSeat !== null) currentSeat = nextSeat;
      if (started) phase = 2;
      updateControls();
      gameState.textContent = started
        ? `地主座位：${landlord}，开始出牌`
        : `座位 ${actor} ${called ? '叫地主' : '不叫地主'}，当前座位：${readField(bytes, 2)}`;
    }

    function applySettlement(bytes) {
      const win = readField(bytes, 1) !== 0;
      const change = readField(bytes, 2) || 0;
      gameState.textContent = `对局结束：${win ? '胜利' : '失败'}，金币变化：${change}`;
      handCodes = [];
      selectedCards.clear();
      currentSeat = null;
      phase = 0;
      actionDeadline = null;
      countdown.textContent = '倒计时：--';
      bottomCards.textContent = '等待下一局';
      lastPlay.textContent = '暂无';
      renderHand();
      loadProfile();
    }

    function showRoomState(bytes) {
      const names = [];
      let index = 6;
      while (index < bytes.length) {
        const [tag, afterTag] = readVarint(bytes, index);
        index = afterTag;
        const field = tag >> 3;
        const wireType = tag & 7;
        if (field === 6 && wireType === 2) {
          const [length, afterLength] = readVarint(bytes, index);
          index = afterLength;
          const end = index + length;
          let seat = null;
          let name = '';
          let online = true;
          let remaining = 0;
          while (index < end) {
            const [nestedTag, afterNestedTag] = readVarint(bytes, index);
            index = afterNestedTag;
            const nestedField = nestedTag >> 3;
            const [nestedLengthOrValue, afterValue] = readVarint(bytes, index);
            index = afterValue;
            if (nestedField === 1) seat = nestedLengthOrValue;
            if (nestedField === 3) online = nestedLengthOrValue !== 0;
            if (nestedField === 4) remaining = nestedLengthOrValue;
            if (nestedField === 2) {
              const textEnd = index + nestedLengthOrValue;
              name = new TextDecoder().decode(bytes.slice(index, textEnd));
              index = textEnd;
            }
          }
          names.push(`${seat}: ${name}（${remaining} 张）${online ? '' : '（离线）'}`);
          continue;
        }
        if (wireType === 2) {
          const [length, afterLength] = readVarint(bytes, index);
          index = afterLength + length;
        } else if (wireType === 0) {
          index = readVarint(bytes, index)[1];
        } else {
          break;
        }
      }
      seats.textContent = '';
      for (let seat = 0; seat < 3; seat++) {
        const card = document.createElement('div');
        const player = names[seat] || `座位 ${seat}：等待`;
        card.className = 'seat';
        if (seat === currentSeat) card.classList.add('active');
        if (player.includes('离线')) card.classList.add('offline');
        card.textContent = player;
        seats.appendChild(card);
      }
      const statePhase = readField(bytes, 3);
      const stateCurrentSeat = readField(bytes, 4);
      if (statePhase !== null) phase = statePhase;
      if (stateCurrentSeat !== null) currentSeat = stateCurrentSeat;
      const remainingSeconds = readField(bytes, 11);
      if (remainingSeconds !== null) actionDeadline = Date.now() + remainingSeconds * 1000;
      const bottom = cardsForField(bytes, 8);
      const lastCards = cardsForField(bytes, 10);
      bottomCards.textContent = bottom.length ? bottom.map(cardName).join(' ') : '等待地主确定';
      lastPlay.textContent = lastCards.length
        ? `座位 ${readField(bytes, 9)}：${lastCards.map(cardName).join(' ')}`
        : '暂无';
      updateControls();
    }

    function renderHand() {
      hand.textContent = '';
      for (const code of handCodes) {
        const button = document.createElement('button');
        button.textContent = cardName(code);
        button.classList.toggle('selected', selectedCards.has(code));
        button.onclick = () => {
          if (selectedCards.has(code)) selectedCards.delete(code);
          else selectedCards.add(code);
          renderHand();
        };
        hand.appendChild(button);
      }
      updateControls();
    }

    function updateControls() {
      const myTurn = playerSeat !== null && playerSeat === currentSeat;
      document.querySelector('#call').disabled = !myTurn || phase !== 1;
      document.querySelector('#decline').disabled = !myTurn || phase !== 1;
      document.querySelector('#play').disabled = !myTurn || phase !== 2 || selectedCards.size === 0;
      document.querySelector('#pass').disabled = !myTurn || phase !== 2;
    }

    setInterval(() => {
      if (actionDeadline === null) return;
      const seconds = Math.max(0, Math.ceil((actionDeadline - Date.now()) / 1000));
      countdown.textContent = `倒计时：${seconds} 秒`;
    }, 250);

    function connect() {
      if (socket && socket.readyState === WebSocket.OPEN) return;
      socket = new WebSocket(`ws://${window.location.hostname}:9001`);
      socket.binaryType = 'arraybuffer';
      socket.onopen = () => {
        status.textContent = '已连接';
        write('WebSocket connected');
        clearInterval(heartbeatTimer);
        heartbeatTimer = setInterval(() => send(3), 3000);
        if (reconnectAfterLogin) sendLogin();
      };
      socket.onclose = () => {
        status.textContent = '已断开';
        clearInterval(heartbeatTimer);
        write('WebSocket closed');
        if (loggedIn) reconnectAfterLogin = true;
        if (shouldReconnect) {
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, 2000);
        }
      };
      socket.onerror = () => write('WebSocket error');
      socket.onmessage = event => {
        const bytes = new Uint8Array(event.data);
        const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const messageId = view.getUint16(4, false);
        const names = {
          2: 'S2C_LOGIN_RET',
          4: 'S2C_HEARTBEAT_RET',
          6: 'S2C_MATCH_RET',
          8: 'S2C_CALL_LANDLORD_RET',
          10: 'S2C_PLAY_CARDS_RET',
          12: 'S2C_PASS_RET',
          13: 'S2C_DEAL_CARDS',
          15: 'S2C_RECONNECT_SYNC',
          16: 'S2C_SETTLE_RESULT',
          17: 'S2C_PLAY_BROADCAST',
          18: 'S2C_TIMEOUT_ACTION',
          19: 'S2C_ROOM_STATE'
        };
        if (messageId === 13) showDeal(bytes);
        if (messageId === 15) showDeal(bytes, 6);
        if (messageId === 19) showDeal(bytes, 7);
        if (messageId === 19) showRoomState(bytes);
        if (messageId === 17) applyPlayBroadcast(bytes);
        if (messageId === 8) applyCallLandlord(bytes);
        if (messageId === 16) applySettlement(bytes);
        if (messageId === 18) {
          const nextSeat = readField(bytes, 3);
          if (nextSeat !== null) currentSeat = nextSeat;
          phase = readField(bytes, 2) || phase;
          updateControls();
          gameState.textContent = `座位 ${readField(bytes, 1)} 操作超时，当前座位：${currentSeat}`;
        }
        if (messageId === 2) {
          loggedIn = true;
          loadProfile();
          if (reconnectAfterLogin) {
            reconnectAfterLogin = false;
            send(14);
          }
        }
        write(`收到 ${names[messageId] || messageId}: ${[...bytes].join(',')}`);
      };
    }

    document.querySelector('#connect').onclick = () => {
      shouldReconnect = true;
      connect();
    };

    document.querySelector('#login').onclick = () => sendLogin();
    document.querySelector('#heartbeat').onclick = () => send(3);
    document.querySelector('#match').onclick = () => send(5);
    document.querySelector('#call').onclick = () => send(7, [0x08, 0x01]);
    document.querySelector('#decline').onclick = () => send(7, [0x08, 0x00]);
    document.querySelector('#play').onclick = () => {
      const body = [];
      for (const card of selectedCards) body.push(0x08, ...varint(card));
      send(9, body);
      selectedCards.clear();
      renderHand();
    };
    document.querySelector('#pass').onclick = () => send(11);
    document.querySelector('#reconnect').onclick = () => send(14);
  </script>
</body>
</html>
